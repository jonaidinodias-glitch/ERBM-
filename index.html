<style>
/* VOICE: outil de chantier, net et direct, lisible sur téléphone en plein soleil
   IDEA: le plan de cité minière — chaque maison est une tuile de brique qui fonce à mesure que les travaux avancent
   PICTURE: la carte de la cité en haut du tableau de bord, une tuile par logement
   COLOUR and TYPE: blanc, encre charbon, brique rouge du bassin minier, ardoise pour le terminé ; Archivo + Inter
   LAYOUT: barre d'onglets (en bas sur téléphone), listes en une colonne, fiche logement en panneau plein écran */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#141518);--bg2:light-dark(#f4f2ef,#1d1f23);--ink:light-dark(#1b1d22,#eceae6);--mute:light-dark(#686a70,#a3a4a8);--line:light-dark(#e2dfda,#2e3036);--brick:light-dark(#c95f12,#f08a3c);--brick2:light-dark(#fbe3d0,#4a2c18);--slate:light-dark(#0f2a44,#7fa6cf);--warn:light-dark(#9a5b00,#f0b45a);--card:light-dark(#fff,#191a1e)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:Archivo,Inter,sans-serif;line-height:1.1;margin:0;text-wrap:balance}
h1{font-size:clamp(24px,4vw,34px);font-weight:800}h2{font-size:21px;font-weight:700}h3{font-size:17px;font-weight:700}
header{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:baseline;padding:18px max(4vw,16px) 10px;border-bottom:1px solid var(--line)}
header .sub{color:var(--mute);font-size:14px}
nav{display:flex;gap:4px;padding:0 max(4vw,16px);border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5;overflow-x:auto}
nav a{flex:none;padding:12px 14px;color:var(--mute);text-decoration:none;font-weight:600;font-size:15px;border-bottom:3px solid transparent}
nav a.on{color:var(--ink);border-color:var(--brick)}
main{padding:20px max(4vw,16px) 100px;max-width:1240px;margin:0 auto}
.note{background:var(--bg2);border-radius:10px;padding:10px 14px;font-size:14px;color:var(--mute);margin-bottom:16px}
.note.warn{color:var(--warn)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:16px 0 24px}
.kpi{border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi b{display:block;font:800 clamp(26px,5vw,34px)/1 Archivo,sans-serif}
.kpi span{font-size:13px;color:var(--mute)}
.cite{margin-bottom:18px}
.cite h3{margin-bottom:8px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:6px}
.tile{position:relative;aspect-ratio:1/1.05;border:0;border-radius:4px 4px 3px 3px;font:700 13px Archivo,sans-serif;cursor:pointer;color:#fff;padding:0;clip-path:polygon(0 28%,50% 0,100% 28%,100% 100%,0 100%);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:6px}
.tile i{font-style:normal;font-size:10px;font-weight:500;opacity:.85}
.tile:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--mute);margin:6px 0 20px}
.legend span::before{content:"";display:inline-block;width:12px;height:12px;border-radius:2px;margin-right:6px;vertical-align:-1px;background:var(--c)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:24px}
.bars .row{display:grid;grid-template-columns:minmax(0,11em) minmax(0,1fr) 2.5em;gap:8px;align-items:center;font-size:14px;margin:6px 0}
.bars .track{height:12px;background:var(--bg2);border-radius:6px;overflow:hidden}
.bars .fill{height:100%;background:var(--brick);border-radius:6px}
.bars .n{text-align:right;font-variant-numeric:tabular-nums}
.bars.fin .row{grid-template-columns:minmax(0,13em) minmax(0,1fr) 8.5em}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--card);cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%}
.item:hover{border-color:var(--brick)}
.item .t{font-weight:600}.item .s{font-size:13px;color:var(--mute)}
.badge{display:inline-block;font:700 12px Archivo,sans-serif;padding:3px 8px;border-radius:20px;background:var(--brick2);color:var(--brick);white-space:nowrap}
.badge.gr{background:light-dark(#dfeeee,#1f3536);color:var(--slate)}
.badge.ok{background:var(--slate);color:#fff}.badge.late{background:var(--warn);color:#fff}
.prog{width:56px;height:56px}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
input,select,textarea{font:16px Inter,sans-serif;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;width:100%}
textarea{min-height:90px}

.tools input{flex:1 1 200px;width:auto}.tools select{flex:0 1 190px;width:auto}

button.p{background:var(--brick);border-color:var(--brick);color:#fff}
button.d{color:var(--brick)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:10px 14px}
label{display:block;font-size:13px;color:var(--mute);font-weight:500}

.sheet{position:fixed;inset:0;background:rgb(0 0 0/.4);z-index:20;display:none;justify-content:flex-end}

.panel{background:var(--bg);width:min(760px,100%);height:100%;overflow-y:auto;padding:0 0 60px}

.sec{padding:16px 18px;border-bottom:1px solid var(--line)}
.sec h3{margin-bottom:10px}
.steps{list-style:none;margin:0;padding:0}
.steps li{display:grid;grid-template-columns:32px minmax(0,1fr) 150px;gap:10px;align-items:center;padding:6px 0}
.steps .ck{width:32px;height:32px;border-radius:50%;border:2px solid var(--line);background:var(--bg);cursor:pointer;font:700 14px Archivo;color:#fff;padding:0}
.steps li.done .ck{background:var(--slate);border-color:var(--slate)}
.steps li.cur .ck{border-color:var(--brick)}
.steps li.cur span{font-weight:700}
.steps input{min-height:38px;padding:6px 8px;font-size:15px}
.lots{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:6px}
.lot{display:flex;justify-content:space-between;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;cursor:pointer;background:var(--bg);font:15px Inter;color:var(--ink);text-align:left;min-height:44px}
.lot em{font-style:normal;font-size:12px;font-weight:600;padding:2px 8px;border-radius:12px;background:var(--bg2);color:var(--mute);white-space:nowrap}
.lot.s1 em{background:var(--brick2);color:var(--brick)}.lot.s2 em{background:var(--slate);color:#fff}
.lot.s3{opacity:.45}
.res{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px}
.res.lev{opacity:.6}.res img{max-width:160px;border-radius:8px;grid-column:1/-1}
.ft{border-collapse:collapse;width:100%;font-size:14px}.ft th{text-align:left;font-size:12px;color:var(--mute);font-weight:600;padding:6px;border-bottom:1px solid var(--line)}.ft td{padding:6px;border-bottom:1px solid var(--line);vertical-align:middle}.ft td.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}.ft input{width:80px;min-height:38px;padding:6px}.ft .b{min-height:36px;padding:0 10px}.scroll{overflow-x:auto}
.chk{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--ink);font-weight:500;min-height:44px}.chk input{width:22px;height:22px;min-height:0;margin:0;accent-color:var(--brick)}
.cklot{font-size:15px;margin:16px 0 6px;color:var(--brick)}
.vprog{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin:16px 0 8px;padding:12px 14px;border-radius:12px;background:var(--bg2);font-size:14px}
.vbar{flex:1 1 160px;height:8px;border-radius:5px;background:var(--line);overflow:hidden}.vbar i{display:block;height:100%;background:var(--brick);border-radius:5px;transition:width .3s}
.vzone{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--slate);margin:22px 0 8px;padding-bottom:6px;border-bottom:2px solid var(--brick)}
.vsec{border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:var(--card);overflow:hidden}
.vsec>summary{list-style:none;display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;font:700 15px Archivo,Inter,sans-serif;min-height:48px}
.vsec>summary::-webkit-details-marker{display:none}
.vsec>summary::before{content:"";width:8px;height:8px;border-right:2px solid var(--mute);border-bottom:2px solid var(--mute);transform:rotate(-45deg);transition:transform .15s;flex:none}
.vsec[open]>summary::before{transform:rotate(45deg)}
.vsec>summary .vt{flex:1}.vsec>summary .vc{font:600 13px Inter,sans-serif;color:var(--mute);display:flex;gap:8px;align-items:center}
.vsec>summary em{font-style:normal;background:var(--brick2);color:var(--brick);padding:2px 8px;border-radius:12px}
.vsec.full>summary .vc{color:var(--slate)}
.vsec[open]>summary{border-bottom:1px solid var(--line)}
.vsec .ck{border:0;border-bottom:1px solid var(--line);border-radius:0;margin:0;padding:10px 14px}.vsec .ck:last-child{border-bottom:0}
.vsec .ck.no .ckh>span:first-child{color:var(--mute)}
.cmd{border:2px solid var(--slate);border-radius:14px;padding:14px;margin:0 0 22px;background:var(--card)}.cmdh{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}.cmdh h2{text-transform:capitalize}.cmdh .pchip{flex:none}
.cmdi{border-left:5px solid var(--ec)}.cmdl{background:color-mix(in srgb,#C00000 6%,var(--card))}.cmdc{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.tpgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:12px}.tpc{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--card)}.tpc.tpok{border-color:#2e7d32;box-shadow:inset 4px 0 0 #2e7d32}
.tpimg{width:100%;max-height:220px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:8px;margin-top:8px}.tpnone{display:flex;align-items:center;justify-content:center;height:120px;border:1px dashed var(--line);border-radius:8px;color:var(--mute);margin-top:8px}
.tpv{border-top:1px solid var(--line);padding-top:8px;margin-top:8px;display:grid;gap:6px}.tpv select,.tpv input{min-height:38px;padding:6px 8px;font-size:14px}
.rot td{vertical-align:top;min-width:170px}.rcell,.rtir{display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;border:1px solid var(--line);border-left:4px solid var(--mute);border-radius:8px;padding:6px 8px;background:var(--card);color:var(--ink);font:13px Inter,sans-serif;cursor:pointer}
.rtir{border-left-color:var(--slate);flex-direction:row;flex-wrap:wrap;align-items:center;gap:6px}
.rcell span{color:var(--mute)}.rcell em{font-style:normal;font-size:12px;font-weight:600}.rcell.rcur{border-left-color:var(--brick)}.rcell.rcur em{color:var(--brick)}.rcell.rdone{border-left-color:#2e7d32;opacity:.7}.rcell.rdone em{color:#2e7d32}.rcell.rwarn{border-color:#C00000;border-left-color:#C00000}.rcell.rwarn em{color:#C00000}
.seg2{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}.seg2 button{border:0;background:var(--bg);color:var(--ink);font:600 15px Inter;min-height:44px;padding:0 14px;cursor:pointer}.seg2 button+button{border-left:1px solid var(--line)}.seg2 button.on{background:var(--slate);color:#fff}
.gwrap{position:relative;--gl:150px;--gc:40px;overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--card);-webkit-overflow-scrolling:touch}
.grow{display:grid;min-width:max-content;border-bottom:1px solid var(--line);background:linear-gradient(to right,var(--line) 1px,transparent 1px) var(--gl) 0/var(--gc) 100% repeat-x;min-height:34px;align-items:center}
.grow>*{grid-row:1}
.glab{position:sticky;left:0;z-index:2;background:var(--card);grid-column:1;font:600 12.5px Inter,sans-serif;padding:6px 8px;border:0;border-right:1px solid var(--line);text-align:left;color:var(--ink);align-self:stretch;display:flex;align-items:center;gap:6px;overflow:hidden}
.glog{background:var(--bg2)}.glog .glab{background:var(--bg2);font:700 12.5px Archivo,sans-serif;cursor:pointer;text-transform:uppercase}
.gent{border-left:4px solid var(--ec);font-weight:600;color:var(--mute)}
.ghead{background-color:var(--bg2);position:sticky;top:0;z-index:3}.ghead .glab{background:var(--bg2)}
.gwk{font:700 12px Archivo;text-align:center;padding:4px 0;border-left:1px solid var(--line);color:var(--slate)}
.gday{font:600 11px Inter;text-align:center;line-height:1.2;padding:3px 0;color:var(--mute)}.gday.gtd{background:var(--brick);color:#fff;border-radius:4px}
.gtdc{align-self:stretch;background:color-mix(in srgb,var(--brick) 12%,transparent)}
.gbar{z-index:1;margin:4px 2px;min-height:24px;border:0;border-radius:5px;font:600 11px Inter,sans-serif;padding:2px 6px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.gbar.gblk{outline:2px dashed #C00000;outline-offset:-2px}.gbar.gdone{opacity:.45}

.cra{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:6px;display:grid;gap:6px}.cra.done{opacity:.55}.cra.done input[data-cra$="|txt"]{text-decoration:line-through}
.cra2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,150px) auto;gap:6px}.cra input{min-height:40px;padding:6px 10px}

.pst-h{display:flex;justify-content:space-between;gap:8px;align-items:center}.pst-g{margin-top:8px}.pst-g .wide{grid-column:1/-1}

button.kpi{font:inherit;color:inherit;background:var(--card);text-align:left;cursor:pointer;border-left:5px solid var(--pc)}button.kpi.on{outline:2px solid var(--pc)}button.kpi b{color:var(--pc)}
.vmt{display:block;font-size:12px;color:var(--brick);font-weight:600;margin-top:2px}
.ckb .wide{grid-column:1/-1}
.phl{display:flex!important;align-items:center;justify-content:center;min-height:40px;border:1px dashed var(--line);border-radius:10px;color:var(--ink)!important;cursor:pointer;font-weight:600!important}
.ckph{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.ckph .ckimg{width:88px;height:88px;object-fit:cover;margin:0}
.ck{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:6px}.ck.on{border-color:var(--brick);background:color-mix(in srgb,var(--brick2) 35%,var(--bg))}

.pvc{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}.res.pv{grid-template-columns:minmax(0,1fr) auto}@media(max-width:600px){.res.pv{grid-template-columns:1fr}.pvc{justify-content:flex-start}}

/* ===== Habillage façon Évolud ===== */
:root,:root[data-theme=dark]{color-scheme:light;--bg:#eef2f8;--bg2:#F2F6FC;--card:#fff;--ink:#1d2433;--mute:#5b667a;--line:#e2e7f0;--brick:#2F5597;--brick2:#dbe8fb;--slate:#1F3864;--warn:#9a5b00;--r:12px}
body{background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,"Segoe UI",Roboto,Arial,sans-serif}
h1,h2,h3{font-family:inherit}h2{font-size:18px;color:var(--slate)}h3{font-size:15px;color:var(--slate)}
.vt{font-size:20px;color:var(--slate);margin:4px 2px 12px;font-weight:800}
header{position:sticky;top:0;z-index:10;background:var(--slate);color:#fff;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top));display:flex;align-items:center;gap:10px;border:0;flex-wrap:nowrap}
header .hl{flex:1;min-width:0;display:flex;flex-direction:column}header h1{font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff}
header .sub{color:rgba(255,255,255,.75);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#syncst{font-size:12px;color:rgba(255,255,255,.9)!important;white-space:nowrap}
.hbtn{background:rgba(255,255,255,.14);color:#fff;border:0;border-radius:9px;padding:7px 11px;font-size:16px;cursor:pointer}
nav#nav{position:fixed;top:auto;bottom:0;left:0;right:0;z-index:10;background:#fff;border-top:1px solid var(--line);border-bottom:0;display:flex;justify-content:space-around;padding:0 0 env(safe-area-inset-bottom);box-shadow:0 -2px 10px rgba(20,40,80,.06)}
nav#nav a{flex:1;text-align:center;padding:7px 2px 8px;color:var(--mute);text-decoration:none;font-size:11px;font-weight:500;border:0;border-top:3px solid transparent;max-width:160px}
nav#nav a b{display:block;font-size:20px;line-height:1.25;font-weight:400}
nav#nav a.on{color:var(--brick);font-weight:700;border-top-color:var(--brick)}

function dl(filename,data){try{const b=data instanceof Blob?data:new Blob([data],{type:/\.csv$/.test(filename)?'text/csv;charset=utf-8':'application/octet-stream'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);return true}catch(e){return false}}
const downloads={save:async({filename,data})=>{if(!dl(filename,data))throw {code:'unavailable'};return {status:'saved'}}};
function toJpeg(file,max=1600){return new Promise((ok,ko)=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.82).split(',')[1])};im.onerror=ko;im.src=fr.result};fr.onerror=ko;fr.readAsDataURL(file)})}
async function pdfToJpeg(file,max=2400){
 if(!window.pdfjsLib){await new Promise((ok,ko)=>{const sc=document.createElement('script');sc.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';sc.onload=ok;sc.onerror=ko;document.head.appendChild(sc)});pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'}
 const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise,pg=await pdf.getPage(1),v0=pg.getViewport({scale:1}),k=max/Math.max(v0.width,v0.height),vp=pg.getViewport({scale:k});
 const c=document.createElement('canvas');c.width=Math.round(vp.width);c.height=Math.round(vp.height);const cx=c.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,c.width,c.height);await pg.render({canvasContext:cx,viewport:vp}).promise;return c.toDataURL('image/jpeg',.85).split(',')[1]}
const toJpegAny=(file,max)=>/pdf$/i.test(file.type)||/\.pdf$/i.test(file.name||'')?pdfToJpeg(file,Math.max(max||1600,2400)):toJpeg(file,max);
const assets={upload:async(file,max)=>{const l=S.open&&S.logs[S.open];const b64=await toJpegAny(file,max);const ug=String((l&&(l.ug||l.num))||'ERBM');const name='ERBM_'+ug+'_'+Date.now()+'.jpg';const j=await api({action:'photo',ug,name,b64,kind:'ERBM',meta:{adresse:l?l.adresse:'',ts:Date.now(),comment:'ERBM'}});return {id:j.fileId,url:j.url}}};
function conf(){const d=SY.det||{},c=SY.conf||{};return {u:c.u||d.u||'',t:c.t||d.t||'',d:c.d||d.d||SY.dev||'',n:c.n||d.n||''}}
async function api(body){const c=conf();if(!c.u||!c.t)throw new Error('Connexion au serveur non réglée (Réglages)');const r=await fetch(c.u,{method:'POST',body:JSON.stringify(Object.assign({token:c.t,device:c.d,user:c.n?c.n+' (ERBM)':'ERBM'},body))});const j=await r.json();if(!j.ok)throw new Error(j.error||'erreur serveur');return j}
function detect(){
 const out={},seen=new Set();
 const take=(o)=>{const ks=Object.keys(o);let url=null;for(const k of ks){const v=o[k];if(typeof v==='string'&&/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec/.test(v))url=v}
  if(url){if(!out.u)out.u=url;for(const k of ks){const v=o[k];if(typeof v!=='string')continue;if(/^(t|token|cle|clé|key|cleChantier)$/i.test(k)&&!out.t)out.t=v;if(/^(d|device|deviceId|appareil|dev)$/i.test(k)&&!out.d)out.d=v;if(/^(n|user|nom|userName|utilisateur)$/i.test(k)&&!out.n)out.n=v}}
  for(const k of ks){const v=o[k];if(typeof v!=='string'||v.length>120)continue;if(/^(token|cle|clé|cleChantier)$/i.test(k)&&!out.t)out.t=v;if(/^(device|deviceId|appareil)$/i.test(k)&&!out.d)out.d=v}};
 const visit=(o,d)=>{if(o==null||d>6)return;if(typeof o==='string'){if(!out.u){const m=o.match(/https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec/);if(m)out.u=m[0]}if(o.length<300000&&(o[0]==='{'||o[0]==='[')){try{visit(JSON.parse(o),d+1)}catch(e){}}return}
  if(typeof o!=='object'||seen.has(o))return;seen.add(o);try{take(o)}catch(e){}let n=0;for(const k of Object.keys(o)){if(++n>400)break;visit(o[k],d+1)}};
 try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k==='evolud_k'||k===LSK)continue;const v=localStorage.getItem(k);if(/token|cle|clé/i.test(k)&&v&&v.length<120&&!out.t&&v[0]!=='{')out.t=v;if(/device|appareil/i.test(k)&&v&&v.length<120&&!out.d&&v[0]!=='{')out.d=v;visit(v,0)}}catch(e){}
 try{if(window.parent&&window.parent!==window&&window.parent.__EVG)visit(window.parent.__EVG,0)}catch(e){}
 return out}
let syncing=false,again=false,syncT=null;
function sched(ms=1500){clearTimeout(syncT);syncT=setTimeout(sync,ms)}
function setSt(){const e=$('syncst');if(!e)return;const n=Object.keys(SY.dirty).length;e.textContent=SY.err?('⚠ '+SY.err):(syncing?'Synchro…':(n?n+' en attente':(SY.last?'✓ '+new Date(SY.last).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}):'')));e.style.color=SY.err?'var(--warn)':'var(--mute)'}
const typing=()=>{const a=document.activeElement;return a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)&&a.type!=='file'};
function recOf(key){
 const [k,id]=[key.slice(0,1),key.slice(2)];
 if(STK[k]){const store=S[STK[k]],o=store[id];
  if(!o){const ts=SY.dead[key];return ts?[{c:ME,id:key,updatedAt:ts,data:{id:key,type:STT[k],deleted:true,updatedAt:ts}}]:[]}
  const u=o._u||Date.now(),d={id:key,type:STT[k],updatedAt:u,v:o};
  if(k==='R'){d.date=o.date||'';d.titre=o.titre||''}else if(k==='L'){d.ug=o.ug||'';d.adresse=o.adresse||'';d.cite=o.cite||'';d.parcours=(P[o.parcours]||{}).court||'';d.etape=etat(o);d.montant=Math.round(montant(o)*100)/100}else{d.adresse=(o.num?'N° '+o.num+' ':'')+(o.adresse||'')}
  return [{c:ME,id:key,updatedAt:u,data:d}]}
 if(key==='C:cfg')return [{c:ME,id:key,updatedAt:SY.cfgU||Date.now(),data:{id:key,type:'config',updatedAt:SY.cfgU||Date.now(),v:S.cfg}}];
 if(key==='B:bpu'){const U=SY.bpuU||Date.now(),N=250,n=Math.max(1,Math.ceil(S.bpu.length/N)),out=[];for(let i=0;i<Math.max(n,SY.bpuN||0);i++){const id='B:'+i;out.push({c:ME,id,updatedAt:U,data:{id,type:'bpu',updatedAt:U,i,n,v:i<n?S.bpu.slice(i*N,i*N+N):[]}})}SY.bpuN=n;return out}
 return []}
function applyRecs(recs){
 let ch=false;
 recs.forEach(r=>{const d=r.data||{},key=String(r.id),k=key.slice(0,1),U=+d.updatedAt||0;
  if(STK[k]){const store=S[STK[k]],id=key.slice(2),loc=store[id];
   if(SY.dirty[key]&&((loc&&(loc._u||0)>U)||(SY.dead[key]||0)>U))return;
   if(d.deleted){if(loc&&(loc._u||0)<=U){delete store[id];ch=true}SY.dead[key]=U;return}
   if(!loc||(loc._u||0)<U||!SY.dirty[key]){if(!loc||(loc._u||0)!==U){store[id]={...d.v,_u:U};ch=true}}}
  else if(key==='C:cfg'){if(U>(SY.cfgU||0)&&!SY.dirty[key]){S.cfg={...(d.v||{})};SY.cfgU=U;ch=true}}
  else if(k==='B'){if(U>(SY.bpuU||0)&&!SY.dirty['B:bpu']){const g=SY.bc[U]||(SY.bc[U]={n:d.n,p:{}});g.p[d.i]=d.v||[]}}});
 Object.keys(SY.bc).map(Number).sort((a,b)=>b-a).forEach(U=>{const g=SY.bc[U];if(U>(SY.bpuU||0)&&Object.keys(g.p).length>=g.n){let all=[];for(let i=0;i<g.n;i++)all=all.concat(g.p[i]||[]);S.bpu=all;SY.bpuU=U;SY.bpuN=g.n;ch=true}});
 Object.keys(SY.bc).forEach(U=>{if(+U<=(SY.bpuU||0))delete SY.bc[U]});
 return ch}
async function sync(){
 if(syncing){again=true;return}
 const c=conf();if(!c.u||!c.t){SY.err='serveur non réglé';setSt();return}
 syncing=true;SY.err='';setSt();
 const keys=Object.keys(SY.dirty),sentU={};keys.forEach(k=>{sentU[k]=k==='C:cfg'?SY.cfgU:k==='B:bpu'?SY.bpuU:(((S[STK[k[0]]]||{})[k.slice(2)]||{})._u||SY.dead[k]||0)});

  const j=await api({action:'erbm',since:SY.since||0,records});
  keys.forEach(k=>{const now=k==='C:cfg'?SY.cfgU:k==='B:bpu'?SY.bpuU:(((S[STK[k[0]]]||{})[k.slice(2)]||{})._u||SY.dead[k]||0);if(now===sentU[k])delete SY.dirty[k]});

/* --- import de la demande d'acompte (Excel du groupement) --- */
function parseSituation(rows){
 const T=v=>String(v??'').replace(/\s+/g,' ').trim();
 const N=v=>typeof v==='number'?v:(parseFloat(String(v??'').replace(/\s|€/g,'').replace(',','.'))||0);
 const find=(re,from=0)=>{for(let i=from;i<rows.length;i++){const r=rows[i]||[];for(let j=0;j<r.length;j++)if(re.test(T(r[j])))return {i,j}}return null};
 const right=(p)=>{const r=rows[p.i]||[];for(let j=p.j+1;j<r.length;j++)if(T(r[j])!=='')return r[j];return ''};
 const out={n:'',date:'',chantier:'',code:'',membres:[]};
 const a=find(/^demande d.acompte/i);if(a)out.n=T(right(a));
 const d=find(/^avancement au/i);if(d){const v=right(d);const loc=x=>{const y=new Date(x.getTime()+432e5);return y.getFullYear()+'-'+String(y.getMonth()+1).padStart(2,'0')+'-'+String(y.getDate()).padStart(2,'0')};out.date=v instanceof Date?loc(v):typeof v==='number'?new Date(Math.round((v-25569)*864e5)).toISOString().slice(0,10):String(v).slice(0,10)}
 const c=find(/^nom du chantier$/i);if(c)out.chantier=T(right(c));
 const k=find(/^code chantier$/i);if(k)out.code=T(right(k));
 // ligne des membres : celle qui contient « Montant HT ATH » plusieurs fois -> colonnes ; noms juste au-dessus du bloc
 const sections=[['marche',/^repartition du march/i],['cumul',/^cumul a fin m$/i]];
 const norm=t=>t.normalize('NFD').replace(/[̀-ͯ]/g,'');
 const findN=(re,from=0)=>{for(let i=from;i<rows.length;i++){const r=rows[i]||[];for(let j=0;j<r.length;j++)if(re.test(norm(T(r[j]))))return {i,j}}return null};
 const sec={};
 for(const [key,re] of sections){const h=findN(re);if(!h)continue;
  const hd=findN(/^montant ht ath$/i,h.i);if(!hd)continue;
  const cols=[];(rows[hd.i]||[]).forEach((v,j)=>{if(/^montant ht ath$/i.test(norm(T(v))))cols.push(j)});
  // noms des membres : ligne entre h.i et hd.i qui porte un texte au-dessus de chaque colonne ATH
  let names=cols.map(()=>'');for(let i=h.i;i<hd.i;i++){const r=rows[i]||[];cols.forEach((cj,x)=>{if(!names[x]&&T(r[cj]))names[x]=T(r[cj])})}
  const tot=findN(/^montant travaux$/i,hd.i);if(!tot)continue;
  const r=rows[tot.i]||[];
  sec[key]=cols.map((cj,x)=>({nom:names[x]||('Membre '+(x+1)),ath:N(r[cj]),gr:N(r[cj+1]),tot:N(r[cj+2])}))}
 const base=sec.marche||sec.cumul||[];
 out.membres=base.map((m,x)=>({nom:m.nom,marche:sec.marche?.[x]||null,cumul:sec.cumul?.[x]||null}));
 return out;
}
async function importSituation(input){
 const f=input.files?.[0];if(!f)return;
 if(readonly)return toast('Lecture seule');
 toast('Lecture du fichier…');
 try{
  if(!window.XLSX)await new Promise((ok,ko)=>{const sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';sc.onload=ok;sc.onerror=ko;document.head.appendChild(sc)});
  const wb=XLSX.read(await f.arrayBuffer(),{cellDates:true});
  const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:true,defval:null,blankrows:true});
  const sit=parseSituation(rows);
  const me=sit.membres.find(m=>/bbne/i.test(m.nom))||sit.membres[0];
  if(!me||!me.marche)return toast('Fichier non reconnu : ce n\'est pas une demande d\'acompte du groupement');
  const f2=n=>(Math.round(n*100)/100).toFixed(2).replace('.',',');
  S.cfg.mATH=f2(me.marche.ath);S.cfg.mGR=f2(me.marche.gr);
  if(me.cumul){S.cfg.fATH=f2(me.cumul.ath);S.cfg.fGR=f2(me.cumul.gr)}
  if(sit.n)S.cfg.sitN=sit.n;if(sit.date)S.cfg.sitD=new Date(sit.date+'T12:00').toLocaleDateString('fr-FR');
  await saveCfg();render();toast('Situation n°'+(sit.n||'?')+' importée');
 }catch(e){toast('Lecture impossible : vérifiez que c\'est bien le fichier Excel de la demande d\'acompte')}
 input.value='';
}

function genPrest(l){

 if(/apres-?demain/.test(x))return add(2);
 if(/\bdemain\b/.test(x))return add(1);
 if(/aujourd.?hui|ce jour|dans la journee|ce soir/.test(x))return add(0);
 if(/semaine prochaine/.test(x))return add(((8-b.getDay())%7)||7);
 if(/fin de (la )?semaine/.test(x))return add((5-b.getDay()+7)%7);
 let m=x.match(/\b(\d{1,2})(?:er)?\s+(janvier|fevrier|mars|avril|mai|juin|juillet|aout|septembre|octobre|novembre|decembre)\b/);
 if(m){const mo=MOIS.indexOf(m[2])+1;let y=b.getFullYear();if(ymd(y,mo,+m[1])<add(0))y++;return ymd(y,mo,+m[1])}
 m=x.match(/\b(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?\b/);
 if(m){let y=m[3]?(+m[3]<100?2000+ +m[3]:+m[3]):b.getFullYear();return ymd(y,+m[2],+m[1])}
 for(let i=0;i<7;i++)if(new RegExp('\\b'+JOURS[i]+'\\b').test(x))return add(((i-b.getDay()+7)%7)||7);
 m=x.match(/\ble (\d{1,2})(?:er)?\b/);
 if(m){const d=+m[1];if(d>=1&&d<=31){let y=b.getFullYear(),mo=b.getMonth()+1;if(d<b.getDate()){mo++;if(mo>12){mo=1;y++}}return ymd(y,mo,d)}}

/* --- planning visuel (style Excel / Gantt) --- */
const ymdD=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const txtOn=hex=>{const h=hex.replace('#','');const f=h.length===3?h.split('').map(c=>c+c).join(''):h;const r=parseInt(f.slice(0,2),16),g=parseInt(f.slice(2,4),16),b=parseInt(f.slice(4,6),16);return (r*299+g*587+b*114)/1000>150?'#1b1d22':'#fff'};
function vGantt(items){
 S.gw=S.gw||0;
 const now=new Date();now.setHours(12,0,0,0);
 const start=new Date(now);start.setDate(start.getDate()-((start.getDay()+6)%7)-7+S.gw*7);
 const NW=6,days=[];for(let w=0;w<NW;w++)for(let k=0;k<5;k++)days.push(new Date(start.getTime()+(w*7+k)*864e5));
 const K=days.map(ymdD),td=ymdD(now),N=days.length;
 const span=(a,b)=>{let i=K.findIndex(k=>k>=a),j=-1;for(let x=N-1;x>=0;x--)if(K[x]<=b){j=x;break}return i<0||j<0||j<i?null:[i,j]};
 const dated=items.filter(x=>x.p.deb||x.p.rdv).map(x=>{const a=(x.p.deb||x.p.rdv).slice(0,10),b=(x.p.fin||x.p.deb||x.p.rdv).slice(0,10);return {...x,a,b:b<a?a:b}}).filter(x=>span(x.a,x.b));
 const wk=d=>{const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const n=(t.getUTCDay()+6)%7;t.setUTCDate(t.getUTCDate()-n+3);const f=new Date(Date.UTC(t.getUTCFullYear(),0,4));return 1+Math.round(((t-f)/864e5-3+((f.getUTCDay()+6)%7))/7)};
 const cols=`grid-template-columns:var(--gl) repeat(${N},var(--gc))`;
 const tdi=K.indexOf(td);
 const head=`<div class="grow ghead" style="${cols}"><div class="glab">Semaine</div>${Array.from({length:NW},(_,w)=>`<div class="gwk" style="grid-column:${w*5+2}/span 5">S${wk(days[w*5])} · ${days[w*5].toLocaleDateString('fr-FR',{day:'2-digit',month:'short'})}</div>`).join('')}</div>
 <div class="grow ghead" style="${cols}"><div class="glab"></div>${days.map((d,i)=>`<div class="gday ${i===tdi?'gtd':''}" style="grid-column:${i+2}">${'LMMJV'[i%5]}<br>${d.getDate()}</div>`).join('')}</div>`;
 const byLog={};dated.forEach(x=>{(byLog[x.l.id]??=[]).push(x)});
 const logs=Object.keys(byLog).map(id=>S.logs[id]).filter(Boolean).map(l=>({id:Object.keys(S.logs).find(k=>S.logs[k]===l),l}));
 logs.sort((a,b)=>(a.l.adresse||'').localeCompare(b.l.adresse||'','fr',{numeric:true}));
 const E=ents().map(e=>e.n);
 const body=logs.map(({id,l})=>{
  const its=byLog[id],ens=[...new Set(its.map(x=>x.p.ent||'—'))].sort((a,b)=>(E.indexOf(a)+1||99)-(E.indexOf(b)+1||99));
  return `<div class="grow glog" style="${cols}"><button class="glab" data-open="${id}">${esc((l.num?l.num+' ':'')+(l.adresse||''))} <span class="badge ${l.parcours==='GR'?'gr':''}" style="font-size:10px;padding:1px 6px">${l.parcours==='GR'?'GR':'ATH'}</span></button><div style="grid-column:2/-1"></div></div>`+
   ens.map(en=>`<div class="grow" style="${cols}"><div class="glab gent" style="--ec:${entCol(en)}">${esc(en)}</div>${tdi>=0?`<div class="gtdc" style="grid-column:${tdi+2}"></div>`:''}${its.filter(x=>(x.p.ent||'—')===en).map(x=>{const [i,j]=span(x.a,x.b);const c=entCol(en);return `<button class="gbar ${x.p.st==='bloquee'?'gblk':''} ${x.p.st==='terminee'?'gdone':''}" data-open="${id}" style="grid-column:${i+2}/${j+3};background:${c};color:${txtOn(c)}" title="${esc(x.p.lib+' · '+fdate(x.a)+(x.b!==x.a?' → '+fdate(x.b):'')+' · '+(PST2[x.p.st]||''))}">${esc(x.p.lib)}</button>`}).join('')}</div>`).join('')}).join('');
 const sans=items.filter(x=>!(x.p.deb||x.p.rdv)&&x.p.st!=='terminee').length;
 return `<div class="tools" style="align-items:center"><button class="b" data-gw="-1" aria-label="Semaines précédentes">◀</button><button class="b" data-gw="0">Aujourd'hui</button><button class="b" data-gw="1" aria-label="Semaines suivantes">▶</button><span class="sub" style="color:var(--mute);font-size:14px">${days[0].toLocaleDateString('fr-FR',{day:'2-digit',month:'long'})} → ${days[N-1].toLocaleDateString('fr-FR',{day:'2-digit',month:'long',year:'numeric'})}</span></div>
 ${dated.length?`<div class="gwrap">${head}${body}</div><div class="legend" style="margin-top:10px">${ents().map(e=>`<span style="--c:${e.c}">${esc(e.n)}</span>`).join('')}</div>`:'<p class="empty">Aucune prestation datée sur ces 6 semaines. Dans la fiche d\'un logement, renseignez « Début » et « Fin » (ou un RDV) sur ses prestations.</p>'}
 ${sans?`<p class="note">${sans} prestation(s) sans date ne figurent pas sur le planning : voir la vue Liste.</p>`:''}`;
}


/* --- rotations et déménagements --- */
function vRotations(){
 const T=tirArr();if(!T.length)return '<p class="empty">Ajoutez d\'abord les logements vides (tiroirs) avec « + Logement tiroir ».</p>';
 const td=today(),lim=isoDay(21);
 const mv=[];logArr().filter(l=>l.parcours==='TIR'&&l.tir?.id).forEach(l=>{const t=S.tirs[l.tir.id]||{};
  if(l.tir.du&&!(l.et&&l.et[2])&&l.tir.du<=lim)mv.push({d:l.tir.du,k:'Aller',l,t});
  if(!l.tir.def&&l.tir.au&&!retourne(l)&&l.tir.au<=lim)mv.push({d:l.tir.au,k:'Retour',l,t})});
 mv.sort((a,b)=>a.d.localeCompare(b.d));
 const tn=t=>(t.num?t.num+' ':'')+(t.adresse||'');
 const moves=mv.length?`<div class="list">${mv.map(m=>`<button class="item" data-open="${m.l.id}"><span class="badge ${m.d<td?'late':m.k==='Retour'?'ok':''}">${m.k}</span><span><span class="t">${esc(m.l.loc?.nom||'Famille')} · ${esc(lname(m.l))}</span><br><span class="s">${m.k==='Aller'?'vers le tiroir':'quitte le tiroir'} ${esc(tn(m.t))}${m.t.role==='tampon'?' (tampon)':''}</span></span><span class="s" style="white-space:nowrap">${m.d<td?'en retard · ':''}${esc(fdate(m.d))}</span></button>`).join('')}</div>`:'<p class="note">Aucun déménagement prévu dans les 3 semaines.</p>';
 const rows=T.map(t=>({t,R:rotOf(t.id)})),NR=Math.max(1,...rows.map(r=>r.R.length));
 const cell=l=>{const done=!l.tir.def&&retourne(l),cur=!done&&((l.et&&l.et[2])||(l.tir.du&&l.tir.du<=td));const c=rotConflit(l);
  return `<button class="rcell ${done?'rdone':cur?'rcur':''} ${c?'rwarn':''}" data-open="${l.id}"><b>${esc((l.num?l.num+' ':'')+(l.adresse||''))}</b><span>${l.tir.du?fdate(l.tir.du):'?'} → ${l.tir.def?'définitif':l.tir.au?fdate(l.tir.au):'?'}</span><em>${l.tir.def?(cur?'Mutation définitive':'Mutation définitive prévue'):done?'Revenu chez lui':cur?'Dans le tiroir':'À venir'}${c?' · chevauchement':''}</em></button>`};
 const table=`<div class="scroll"><table class="ft rot"><thead><tr><th>Tiroir (vide)</th>${Array.from({length:NR},(_,i)=>`<th>Rotation ${i+1}</th>`).join('')}</tr></thead><tbody>${rows.map(({t,R})=>`<tr><td><button class="rtir" data-edittir="${t.id}"><b>${esc(tn(t))}</b>${t.role==='tampon'?'<span class="badge" style="font-size:11px">Tampon</span>':''}${t.dispo==='non'?'<span class="badge late" style="font-size:11px">Indispo</span>':''}${isTirLocked(t.id)?'<span class="badge ok" style="font-size:11px">Occupé définitivement</span>':''}${t.from?'<span class="badge gr" style="font-size:11px">Libéré par mutation</span>':''}</button></td>${Array.from({length:NR},(_,i)=>`<td>${R[i]?cell(R[i]):''}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
 // frise par semaine
 S.rw=S.rw||0;const now=new Date();now.setHours(12,0,0,0);const st=new Date(now);st.setDate(st.getDate()-((st.getDay()+6)%7)-14+S.rw*7);
 const NW=16,W=Array.from({length:NW},(_,i)=>new Date(st.getTime()+i*7*864e5)),K=W.map(ymdD),end=ymdD(new Date(st.getTime()+NW*7*864e5));
 const wi=d=>{let i=-1;K.forEach((k,j)=>{if(k<=d)i=j});return i};
 const cols=`grid-template-columns:var(--gl) repeat(${NW},var(--gc))`,cw=wi(ymdD(now));
 const head=`<div class="grow ghead" style="${cols}"><div class="glab">Semaine</div>${W.map((d,i)=>`<div class="gday ${i===cw?'gtd':''}" style="grid-column:${i+2}">${d.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit'})}</div>`).join('')}</div>`;
 const pal=['#2F5597','#c95f12','#4c8c2b','#7030A0','#0091c7','#b8860b'];
 const body=rows.map(({t,R})=>`<div class="grow" style="${cols}"><button class="glab" data-edittir="${t.id}">${esc(tn(t))}</button>${cw>=0?`<div class="gtdc" style="grid-column:${cw+2}"></div>`:''}${R.filter(l=>l.tir.du).map((l,k)=>{const a=l.tir.du,b=l.tir.def?end:l.tir.au||ymdD(new Date(new Date(a+'T12:00').getTime()+56*864e5));if(b<K[0]||a>=end)return '';const i=Math.max(0,wi(a)),j=Math.max(i,b>=end?NW-1:wi(b));const c=pal[k%pal.length];return `<button class="gbar ${retourne(l)&&!l.tir.def?'gdone':''} ${l.tir.au||l.tir.def?'':'gblk'}" data-open="${l.id}" style="grid-column:${i+2}/${j+3};background:${c};color:#fff" title="${esc(lname(l)+' · '+fdate(a)+' → '+(l.tir.def?'mutation définitive':l.tir.au?fdate(l.tir.au):'retour non daté'))}">${l.tir.def?'Définitif':'R'+(R.indexOf(l)+1)} · ${esc((l.num?l.num+' ':'')+(l.adresse||''))}</button>`}).join('')}</div>`).join('');
 return `<h3 style="margin:6px 0 8px">Déménagements des 3 prochaines semaines</h3>${moves}
 <h3 style="margin:24px 0 8px">Rotations par tiroir</h3><p class="note">Chaque famille part dans le tiroir pendant les travaux de son logement, puis revient chez elle ; le tiroir accueille alors la rotation suivante. En cas de mutation définitive, la famille reste dans le tiroir et c'est son ancien logement qui devient vide. Pour ajouter une rotation : dans la fiche du logement, choisissez le tiroir et les dates d'aller et de retour.</p>${table}
 <h3 style="margin:24px 0 8px">Frise des rotations</h3><div class="tools" style="align-items:center"><button class="b" data-rw="-1" aria-label="Plus tôt">◀</button><button class="b" data-rw="0">Aujourd'hui</button><button class="b" data-rw="1" aria-label="Plus tard">▶</button></div>
 <div class="gwrap" style="--gc:58px">${head}${body}</div><p class="note" style="margin-top:8px">Barre en pointillés rouges : retour pas encore daté (affiché sur 8 semaines par défaut).</p>`;
}

/* --- gains de temps : SMS et actions rapides --- */
function smsRdv(l,p){const tel=String(l.loc?.tel||'').replace(/[^\d+]/g,'');if(!tel||!p.rdv)return '';
 const d=new Date(p.rdv),qd=d.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'}),h=d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
 const msg=`Bonjour ${l.loc?.nom||''}, ${p.ent||S.cfg.entreprise||'BBNE'} interviendra chez vous le ${qd} à ${h} pour : ${p.lib}. Merci de confirmer votre présence par retour de SMS. ${conf().n||''} ${S.cfg.entreprise||''}`.replace(/\s+/g,' ').trim();
 return 'sms:'+tel+(/iPhone|iPad|Mac/.test(navigator.userAgent)?'&':'?')+'body='+encodeURIComponent(msg)}
function shiftDay(v,n){if(!v)return v;const t=v.length>10?v.slice(10):'';const d=new Date(v.slice(0,10)+'T12:00');d.setDate(d.getDate()+n);if(d.getDay()===6)d.setDate(d.getDate()+2);if(d.getDay()===0)d.setDate(d.getDate()+1);return ymdD(d)+t}
function quickPrest(lid,i,fn){const l=S.logs[lid];if(!l)return;const c=JSON.parse(JSON.stringify(l));c.prest=(c.prest||[]).map((p,k)=>k===i?fn({...p}):p);save('logements',lid,c);render()}

function ficheData(l,who){

 if(t.dataset.rzeqn&&S.open){const e2=t.dataset.rzeqn,v=t.value;upd(l=>{l.rzo={...(l.rzo||{})};l.rzo.eq={...(l.rzo.eq||{})};l.rzo.eq[e2]={...(l.rzo.eq[e2]||{}),note:v}},false)}
 if(t.dataset.tpv){const [tp,c,k]=t.dataset.tpv.split('|');S.cfg.plans={...(S.cfg.plans||{})};const P2={...(S.cfg.plans[tp]||{})};P2.vals={...(P2.vals||{})};P2.vals[c]={...(P2.vals[c]||{}),[k]:t.value};if(k==='st')P2.vals[c].date=today();S.cfg.plans[tp]=P2;saveCfg();if(k==='st')render()}
 if(t.dataset.crf&&S.cr){const k=t.dataset.crf,v=t.value;updCr(c=>{c[k]=v},t.tagName==='SELECT'||k==='titre')}
 if(t.dataset.crs&&S.cr){const k=t.dataset.crs,v=t.value.split(/\n/).map(x=>x.trim()).filter(Boolean);updCr(c=>{c[k]=v},false)}
 if(t.dataset.cra&&S.cr){const [i,k]=t.dataset.cra.split('|');const v=t.type==='checkbox'?t.checked:t.value;updCr(c=>{c.actions=(c.actions||[]).map((a,j)=>j===+i?{...a,[k]:v}:a)},t.type==='checkbox')}
 if(t.dataset.crdone){const [cid,i]=t.dataset.crdone.split('|');const c=JSON.parse(JSON.stringify(S.crs[cid]));c.actions[+i].fait=t.checked;save('crs',cid,c);toast('Action faite');setTimeout(render,400)}
 if(t.dataset.pr&&S.open){if(readonly)return toast('Lecture seule');const [i,k]=t.dataset.pr.split('|');const v=t.value;upd(l=>{l.prest=(l.prest||[]).map((p,j)=>{if(j!==+i)return p;const q={...p,[k]:v};if(k==='rdv'&&v&&(p.st==='a_planifier'||p.st==='affectee'))q.st='rdv';if(k==='ent'&&p.st==='a_planifier')q.st='affectee';if(k==='deb'&&v&&p.st==='a_planifier')q.st='affectee';if(k==='deb'&&v&&(!p.fin||p.fin<v))q.fin=v;return q})},t.tagName==='SELECT'||k==='rdv'||k==='deb'||k==='fin')}
 if(t.dataset.sd&&S.open){const i=t.dataset.sd,v=t.value;upd(l=>{l.et={...(l.et||{})};if(v)l.et[i]=v;else delete l.et[i]})}
 if(t.id==='pmc'){const b=bpuMap()[t.value.trim()];if(b){$('pmu').value=b.u||'';$('pmp').value=String(b.p).replace('.',',');if(!$('pml').value)$('pml').value=b.d||''}}
 if(t.id==='pvt'){const c=t.selectedOptions[0]?.dataset.c;if(c)$('pvc').value=c}
 if(t.dataset.pvq!==undefined&&S.open){if(readonly)return toast('Lecture seule');const i=+t.dataset.pvq,q=parseFloat(String(t.value).replace(',','.'))||0;upd(l=>{l.prov=(l.prov||[]).map((x,k)=>k===i?{...x,q}:x)})}
 if(t.dataset.pvst!==undefined&&S.open){if(readonly)return toast('Lecture seule');const i=+t.dataset.pvst,st=t.value;upd(l=>{l.prov=(l.prov||[]).map((x,k)=>k===i?{...x,st}:x)})}
 if(t.dataset.ftq!==undefined&&S.open){if(readonly)return toast('Lecture seule');const i=+t.dataset.ftq,q=parseFloat(String(t.value).replace(',','.'))||0;upd(l=>{l.ft=(l.ft||[]).map((x,k)=>k===i?{...x,q}:x)})}
 if(t.dataset.cfg){S.cfg[t.dataset.cfg]=t.value.trim();saveCfg();render()}
 if(t.id==='fp'){S.fp=t.value;render()}if(t.id==='fc'){S.fc=t.value;render()}if(t.id==='fe'){S.fe=t.value;render()}
});
document.addEventListener('input',e=>{if(e.target.id==='q'){S.q=e.target.value;const pos=e.target.selectionStart;render();const q=$('q');q.focus();q.setSelectionRange(pos,pos)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('sheet').classList.contains('on'))closePanel();if(e.key==='Enter'&&e.target.id==='jtxt')act('addj');if(e.key==='Enter'&&e.target.id==='rtxt')act('addres')});
function route(){if(S.more){S.more=false;$('sheet').classList.remove('on')}const h=location.hash.slice(1);S.view=['tableau','logements','planning','cr','tiroirs','reserves','finances','pilotage','reglages','dechets'].includes(h)?h:'tableau';render()}
addEventListener('hashchange',route);

/* --- démarrage --- */
loadLocal();SY.det=detect();route();setSt();
addEventListener('online',()=>sched(500));
document.addEventListener('visibilitychange',()=>{if(!document.hidden)sched(300)});
setInterval(()=>{if(!document.hidden)sync()},60000);
sync();
}
</script>
</body>
</html>
